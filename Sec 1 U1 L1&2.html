    let result = text;
    result = result.replace(/\([^)]*\)/g, ' '); 
    result = result.replace(/[→]/g, ' ');

}

    {en: "From the Pyramids of Giza to the Grand Egyptian Museum, we continue to honor our history while shaping our future.", ar: "من أهرامات الجيزة إلى المتحف المصري الكبير، نواصل تكريم تاريخنا مع تشكيل مستقبلنا."},
    {en: "We take pride in our country, not only for its beauty, but also because we understand the sacrifices of our ancestors.", ar: "نحن نفخر ببلدنا، ليس فقط لجماله، ولكن لأننا نفهم تضحيات أجدادنا."},
    {en: "We work hard to make it greater for generations to come. Every citizen has a role to play - protecting our heritage, contributing to our economy, and sharing our culture with the world.", ar: "نحن نعمل بجد لجعلها أعظم للأجيال القادمة. لكل مواطن دور يلعبه - حماية تراثنا، والمساهمة في اقتصادنا، ومشاركة ثقافتنا مع العالم."}
];

const listeningTextL2 = [
    {en: "Host: Welcome back to 'Our Story'. Today, we're talking to Dr. Mona Hassan, an archaeologist who recently led a team to restore parts of the Philae Temple. Dr. Mona, thank you for joining us.", ar: "المذيع: مرحباً بكم مجدداً في 'قصتنا'. اليوم، نتحدث مع الدكتورة منى حسن، عالمة الآثار التي قادت مؤخراً فريقاً لترميم أجزاء من معبد فيلة. دكتورة منى، شكراً لانضمامك إلينا."},
    {en: "Dr. Mona: Thank you. It's a privilege to be here.", ar: "الدكتورة منى: شكراً لك. إنه لشرف لي أن أكون هنا."},
    {en: "Host: Your work on Philae is a powerful symbol. Can you tell us why preserving our heritage is so important?", ar: "المذيع: عملك في فيلة هو رمز قوي. هل يمكنك إخبارنا لماذا تعد حماية تراثنا مهمة جداً؟"},
    {en: "Dr. Mona: Of course. When we restore a historical site, we're not just fixing old stones. We're reconnecting with our past. Our ancestors left us a rich legacy - from the pyramids to the temples of Upper Egypt. This heritage is the core of our national identity. It reminds us of who we are, where we come from, and the greatness we are capable of. It's a source of immense pride for every Egyptian.", ar: "الدكتورة منى: بالطبع. عندما نرمم موقعاً تاريخياً، نحن لا نقوم فقط بإصلاح حجارة قديمة. نحن نعيد الاتصال بماضينا. لقد ترك لنا أجدادنا إرثاً غنياً - من الأهرامات إلى معابد صعيد مصر. هذا التراث هو جوهر هويتنا الوطنية. إنه يذكرنا بمن نحن، ومن أين أتينا، والعظمة التي نحن قادرون عليها. إنه مصدر فخر هائل لكل مصري."},
    {en: "Host: It sounds like more than a job; it's a mission. What do you think is the biggest challenge to preserving our heritage today?", ar: "المذيع: يبدو الأمر أكثر من مجرد وظيفة؛ إنها مهمة. ما هو برأيك التحدي الأكبر للحفاظ على تراثنا اليوم؟"},
    {en: "Dr. Mona: The challenges are many, from urban development to climate change. But perhaps the biggest is a lack of awareness among our youth. Many young people don't realize the value of these treasures. Our job is to inspire them, to make them see that a thousand-year-old temple is not just a tourist attraction—it's a living part of our story. We need to encourage them to visit these sites, to learn the stories, and to feel the connection.", ar: "الدكتورة منى: التحديات كثيرة، من التطور الحضري إلى تغير المناخ. لكن ربما الأكبر هو نقص الوعي بين شبابنا. العديد من الشباب لا يدركون قيمة هذه الكنوز. مهمتنا هي إلهامهم، لجعلهم يرون أن المعبد الذي يبلغ عمره ألف عام ليس مجرد منطقة جذب سياحي - إنه جزء حي من قصتنا. نحن بحاجة إلى تشجيعهم على زيارة هذه المواقع، وتعلم القصص، والشعور بالارتباط."},
    {en: "Host: That's a great point. You're inspiring them to become the next generation of protectors. Thank you for your valuable work, Dr. Mona.", ar: "المذيع: هذه نقطة رائعة. أنت تلهمهم ليصبحوا الجيل القادم من الحماة. شكراً لعملك القيم، دكتورة منى."}
];

// ===================== بناء الواجهة (نفس المنطق السابق) =====================

function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, storyData) {
        const speakerEmojis = {"Host":"🎙️","Dr. Mona":"👩‍⚕️"};

        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:12px;">${title}</div>
            ${storyData.map((s,i) => {
                const id = `secStory_${title.replace(/\s/g,'')}_${i}`;
                let enText = s.en;
                let speaker = '';
                let dialogueText = enText;
                const colonIndex = enText.indexOf(': ');
                if (colonIndex > 0) {
                    speaker = enText.substring(0, colonIndex);
                    dialogueText = enText.substring(colonIndex + 2);
                }
                const emoji = speakerEmojis[speaker] || '📖';
                const wordHtml = makeWordSpans(dialogueText);
                let speakerHtml = '';
                if (speaker) {
                    speakerHtml = `<span class="speaker-label">${emoji} ${speaker}</span> `;
                }
                return `<div class="sentence" id="${id}" data-speak="${s.en}" onclick="playOne('${id}')">
                    ${speakerHtml} ${wordHtml}
                </div> `;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    const sections = [];

    // 1. Key Vocabulary
    if (keyVocab && keyVocab.length > 0) {
        sections.push({ title:"💊 Key Vocabulary", id:"secKeyVocab", content: `<div class="info-box"><div class="info-title">Key Vocabulary (Lessons 1 & 2)</div><div class="vocab">${makePills(keyVocab, "secKeyVocab")}</div></div>` });
    }

    // 2. Accumulative Vocabulary
    if (accVocab && accVocab.length > 0) {
        sections.push({ title:"📚 Accumulative Vocabulary", id:"secAccVocab", content: `<div class="info-box"><div class="info-title">Accumulative Vocabulary</div><div class="vocab">${makePills(accVocab, "secAccVocab")}</div></div>` });
    }

    // 3. Definitions
    if (defsData && defsData.length > 0) {
        sections.push({ title:"📝 Definitions", id:"secDefs", content: `<div class="rules-grid">${defsData.map((d,i) => {
            const speakText = cleanForSpeech(d.word) + " | " + d.def;
            return makeRuleItem('📖', 'secDefs', i, speakText, d.def, d.word);
        }).join('')}</div>` });
    }

    // 4. Synonyms & Antonyms
    if (synData && synData.length > 0) {
        sections.push({ title:"🔄 Synonyms", id:"secSyn", content: `<div class="rules-grid">${synData.map((s,i) => makeRuleItem('↔️', 'secSyn', i, s.word + " | " + s.syn, s.syn, s.word)).join('')}</div>` });
    }
    if (antData && antData.length > 0) {
        sections.push({ title:"🚫 Antonyms", id:"secAnt", content: `<div class="rules-grid">${antData.map((a,i) => makeRuleItem('🛑', 'secAnt', i, a.word + " | " + a.ant, a.ant, a.word)).join('')}</div>` });
    }

    // 5. Collocations
    if (collocationsData && collocationsData.length > 0) {
        sections.push({ title:"🔗 Collocations", id:"secCollocations", content: `<div class="rules-grid">${collocationsData.map((c,i) => makeRuleItem('🔗', 'secCollocations', i, c[0], c[1], c[0])).join('')}</div>` });
    }

    // 6. Verb + Prepositions (Phrasal Verbs)
    if (phrasalVerbsData && phrasalVerbsData.length > 0) {
        sections.push({ title:"⚡ Verb + Prepositions", id:"secPhrasal", content: `<div class="rules-grid">${phrasalVerbsData.map((p,i) => makeRuleItem('⚡', 'secPhrasal', i, p[0], p[1], p[0])).join('')}</div>` });
    }

    // 7. Derivatives
    if (derivativesData && derivativesData.length > 0) {
        sections.push({ title:"🔨 Derivatives (Word Families)", id:"secDerivatives", content: `<div class="rules-grid">${derivativesData.map((d,i) => {
            const formsStr = d.forms.join(" | ");
            const speakText = `${d.word} | ${formsStr}`;
            const displayText = `${d.word} → ${formsStr}`;
            return makeRuleItem('🔨', 'secDerivatives', i, speakText, d.ex, displayText);
        }).join('')}</div>` });
    }

    // 8. Clear the Confusion
    if (confusionData && confusionData.length > 0) {
        sections.push({ title:"🧐 Clear the Confusion", id:"secConfusion", content: `<div class="rules-grid">${confusionData.map((c,i) => {
            const speakText = `${c.word} | ${c.forms}`;
            const displayText = `${c.word} : ${c.forms}`;
            return makeRuleItem('🧐', 'secConfusion', i, speakText, c.ex, displayText);
        }).join('')}</div>` });
    }

    // 9. Reading Text
    if (readingTextL1 && readingTextL1.length > 0) {
        sections.push({ title:"📖 Reading Text (Lesson 1)", id:"secReadL1", content: makeStorySection("Taking Pride in Our Beloved Egypt", readingTextL1) });
    }

    // 10. Listening Text
    if (listeningTextL2 && listeningTextL2.length > 0) {
        sections.push({ title:"🎧 Listening Text (Lesson 2)", id:"secListenL2", content: makeStorySection("Moments That Shaped Us", listeningTextL2) });
    }

    let html = '';
    sections.forEach(sec => {
        html += `<div class="section-block" id="${sec.id}">
            <div class="sec-title">${sec.title}</div>
            <div class="sec-body">
                ${playBar(sec.id)}
                ${sec.content}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

// ===================== نظام الصوت (نفس الكود تماماً) =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
let voiceLoadAttempt = 0;
const MAX_VOICE_LOAD_ATTEMPTS = 6;
const VOICE_RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];
const normalizeVoiceLang = (lang) => String(lang || '').replace('_', '-');
const isVoiceLangMatch = (voiceLang, targetLang) => {
    const normalized = normalizeVoiceLang(voiceLang).toLowerCase();
    const target = targetLang.toLowerCase();
    return normalized === target || normalized.startsWith(target + '-');
};
const voiceQualityScore = (voice) => {
    const name = String(voice.name || '').toLowerCase();
    let score = 0;
    if (name.includes('google')) score += 30;
    if (name.includes('microsoft')) score += 25;
    if (name.includes('samantha')) score += 20;
    if (voice.localService) score += 2;
    return score;
};
const sortVoicesByQuality = (voiceList) => [...voiceList].sort((a, b) => {
    const scoreDifference = voiceQualityScore(b) - voiceQualityScore(a);
    return scoreDifference || String(a.name || '').localeCompare(String(b.name || ''));
});
function loadVoices() {
    const availableVoices = window.speechSynthesis.getVoices();
    if (availableVoices.length) {
        voices = availableVoices;
        voiceLoadAttempt = 0;
        populateVoiceSelect();
        return;
    }
    if (voiceLoadAttempt < MAX_VOICE_LOAD_ATTEMPTS) {
        const delay = VOICE_RETRY_DELAYS[voiceLoadAttempt] || VOICE_RETRY_DELAYS[VOICE_RETRY_DELAYS.length - 1];
        voiceLoadAttempt++;
        window.setTimeout(loadVoices, delay);
    }
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    if (!vs || !voices.length) return;
    const englishVoices = voices.filter(v =>
        isVoiceLangMatch(v.lang, 'en-US') || isVoiceLangMatch(v.lang, 'en-GB')
    );
    const displayedVoices = englishVoices.length ? sortVoicesByQuality(englishVoices) :
        sortVoicesByQuality(voices.filter(v => normalizeVoiceLang(v.lang).toLowerCase().startsWith('en')));
    if (!displayedVoices.length) {
        note.textContent = '⚠️ No English voice found.';
        return;
    }
    note.textContent = englishVoices.length ? '' : '⚠️ No US/UK voice found; showing English voices.';
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    vs.innerHTML = displayedVoices.map((voice) => {
        const lang = normalizeVoiceLang(voice.lang);
        const label = `${isVoiceLangMatch(lang, 'en-US') ? '🇺🇸 American' : isVoiceLangMatch(lang, 'en-GB') ? '🇬🇧 British' : 'English'} — ${voice.name} (${lang})`;
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = label;
        option.dataset.lang = lang;
        return option.outerHTML;
    }).join('');
    const savedOption = [...vs.options].find(option => option.value === savedURI) ||
        [...vs.options].find(option => option.dataset.lang === savedLang);
    vs.value = savedOption ? savedOption.value : vs.options[0].value;
    const selected = voices.find(v => v.voiceURI === vs.value) || displayedVoices[0];
    localStorage.setItem('voiceURI', selected.voiceURI);
    localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    const selected = voices.find(v => v.voiceURI === this.value);
    if (selected) {
        localStorage.setItem('voiceURI', selected.voiceURI);
        localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
    }
});
function getSelectedVoice() {
    const select = document.getElementById('voiceSelect');
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    const selectedURI = savedURI || (select && select.value);
    return voices.find(v => v.voiceURI === selectedURI) ||
        voices.find(v => savedLang && normalizeVoiceLang(v.lang) === savedLang) ||
        voices.find(v => select && v.voiceURI === select.value) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    u.lang = voice ? normalizeVoiceLang(voice.lang) : (localStorage.getItem('voiceLang') || 'en-US');
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات (نفس الكود) =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
